[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elitecheck"
version = "0.1.0"
description = "Check whether an LLM-judged optimizer's new best is real: A/A negative controls and a promotion gate with exact error rates."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["llm-as-a-judge", "prompt-optimization", "agents", "sequential-testing", "negative-control", "evaluation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
elitecheck = "elitecheck.cli:main"

[tool.hatch.build.targets.sdist]
include = ["elitecheck", "tests", "examples", "README.md", "LICENSE", "AGENTS.md"]
